<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Discord Login</title>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (code) {
    window.location.href = './#/discord-callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || '');
  } else {
    window.location.href = './';
  }
</script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
